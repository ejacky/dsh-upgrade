name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # Both supported platforms are gates: a change that only works on one of them is not
    # finished. Windows keeps the checks it had before the Linux port.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
